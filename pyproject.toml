[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "store-n-recall"
version = "0.1.0"
description = "MCP server giving agents a persistent knowledgebase: store and recall facts about projects"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2",
]

[project.scripts]
store-n-recall = "store_n_recall.server:main"

[tool.setuptools.packages.find]
where = ["src"]
